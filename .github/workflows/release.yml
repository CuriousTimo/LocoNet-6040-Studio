# Builds the installers when a version tag is pushed, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The release is created as a draft; tags with a pre-release part (-beta.N, -rc.N) are marked
# as pre-release. macOS apps are signed ad hoc (tauri.conf.json, signingIdentity "-"), not
# with an Apple Developer ID: macOS shows "unidentified developer" the first time.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: Check tag matches Cargo version
    runs-on: ubuntu-22.04
    outputs:
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag does not match the workspace version $cargo_version in Cargo.toml"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  app:
    name: App (${{ matrix.name }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          # Windows on ARM (Snapdragon laptops), cross-built on the x64 runner as Tauri documents
          - name: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64 deb
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          # RPM doesn't allow "-" in versions: 0.1.0-beta.1 becomes version 0.1.0, release 0.beta.1
          - name: Linux x64 rpm
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: rpm
            rpm: true
          # 64-bit ARM: Raspberry Pi 4 and 5 with 64-bit Raspberry Pi OS, other ARM boards;
          # built natively on GitHub's ARM runners
          - name: Linux ARM64 deb
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
          - name: Linux ARM64 rpm
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: rpm
            rpm: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: RPM version
        if: matrix.rpm
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [[ "$version" == *-* ]]; then
            # Fedora style pre-release: Version 0.1.0, Release 0.beta.1 (older than the final 0.1.0-1)
            echo "{\"version\": \"${version%%-*}\", \"bundle\": {\"linux\": {\"rpm\": {\"release\": \"0.${version#*-}\"}}}}" > "$GITHUB_WORKSPACE/rpm-version.json"
          else
            echo "{}" > "$GITHUB_WORKSPACE/rpm-version.json"
          fi
          cat "$GITHUB_WORKSPACE/rpm-version.json"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: cargo tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ matrix.rpm && format('--config {0}/rpm-version.json', github.workspace) || '' }}
          tagName: ${{ github.ref_name }}
          releaseName: LocoNet 6040 Studio ${{ github.ref_name }}
          releaseBody: Beta, not yet tested with a real Nano. macOS shows "unidentified developer" the first time; see the README, Download.
          releaseDraft: true
          prerelease: ${{ needs.check-version.outputs.prerelease == 'true' }}
